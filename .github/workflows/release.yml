name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          assert os.environ["RELEASE_TAG"] == "v" + project["version"], "Tag must match package version"
          assert project["name"] == "linkkeep", "Unexpected PyPI distribution name"
          import ast
          module = ast.parse(Path("src/linkkeep/__init__.py").read_text())
          version = next(ast.literal_eval(node.value) for node in module.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets))
          assert version == project["version"], "CLI and distribution versions must match"
          PY
      - name: Install and check
        run: |
          python -m pip install -e '.[dev]' twine
          python -m ruff check src tests tools
          python -m ruff format --check src tests tools
          python -m mypy
          python -m pytest --cov=linkkeep --cov-report=term
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  test-install:
    name: Install the built wheel
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install into a clean venv
        run: |
          python -m venv /tmp/verify-venv
          /tmp/verify-venv/bin/pip install --quiet dist/*.whl
          /tmp/verify-venv/bin/linkkeep --version
          /tmp/verify-venv/bin/linkkeep --help

  publish:
    name: Publish to PyPI
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    needs: [build, test-install]
    environment:
      name: pypi
      url: https://pypi.org/p/linkkeep
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

  github-release:
    name: Create the GitHub release
    runs-on: ubuntu-latest
    needs: [build, test-install]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --title "$RELEASE_TAG" --notes-file CHANGELOG.md
